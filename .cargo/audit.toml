[advisories]
ignore = [
    # SQLx records its optional MySQL RSA dependency in Cargo.lock, but Azums enables only
    # PostgreSQL and SQLite. `cargo tree -i rsa --workspace --all-features --target all` has no
    # active path, and RUSTSEC-2023-0071 currently has no fixed RSA release.
    "RUSTSEC-2023-0071",
]
