[package]
name = "azums"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "High-performance job queue & streaming engine for Rust — from embedded to cloud"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/azums"
documentation = "https://docs.rs/azums"
homepage = "https://github.com/BlockForge-Dev/azums"
readme = "../../README.md"
keywords = ["postgres", "sqlite", "job-queue", "background-jobs", "task-queue"]
categories = ["database", "asynchronous"]

[features]
default = ["postgres", "sqlite", "redis", "api", "cli"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
redis = ["dep:azums-redis"]
api = ["dep:axum"]
cli = []

[dependencies]
azums-core = { path = "../azums-core", features = ["sqlx"] }
azums-redis = { path = "../azums-redis", optional = true }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
    "json",
] }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
rand = "0.8"

uuid = { version = "1", features = ["v4", "serde"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }

# Optional: only needed when `api` feature is enabled
axum = { version = "0.7", optional = true }


[dev-dependencies]
testcontainers = "0.15"
serial_test = "3"
dotenvy = "0.15"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "wake_up_latency"
harness = false

[[bench]]
name = "redis_throughput"
harness = false

[[bench]]
name = "concurrent_leasing"
harness = false

[[bench]]
name = "stream_pubsub"
harness = false

[[bench]]
name = "competitors"
harness = false

[[bin]]
name = "azumsctl"
path = "src/bin/azumsctl.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
