[package]
name = "azums"
version = "1.0.1"
edition = "2021"
rust-version = "1.88"
description = "Embedded durable execution runtime for Rust, from Memory and SQLite to PostgreSQL and Redis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/azums"
documentation = "https://docs.rs/azums"
homepage = "https://github.com/BlockForge-Dev/azums"
readme = "../../README.md"
keywords = ["postgres", "sqlite", "job-queue", "background-jobs", "task-queue"]
categories = ["database", "asynchronous"]

[features]
default = ["postgres", "sqlite", "redis", "cli"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
redis = ["dep:azums-redis"]
cli = []

[dependencies]
azums-core = { version = "1.0.1", path = "../azums-core", features = ["sqlx"] }
azums-redis = { version = "1.0.1", path = "../azums-redis", optional = true }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "uuid",
    "chrono",
    "json",
] }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
rand = "0.9"

uuid = { version = "1", features = ["v4", "serde"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tokio-util = "0.7"


[dev-dependencies]
serial_test = "3"
dotenvy = "0.15"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "enqueue"
harness = false

[[bench]]
name = "dequeue"
harness = false

[[bench]]
name = "wake_up_latency"
harness = false

[[bench]]
name = "redis_throughput"
harness = false

[[bench]]
name = "concurrent_leasing"
harness = false

[[bench]]
name = "stream_pubsub"
harness = false

[[bench]]
name = "competitors"
harness = false

[[bin]]
name = "azumsctl"
path = "src/bin/azumsctl.rs"
required-features = ["cli"]

[[bin]]
name = "azums-perf"
path = "src/bin/azums-perf.rs"

[[bin]]
name = "azums-perf-guard"
path = "src/bin/azums-perf-guard.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
