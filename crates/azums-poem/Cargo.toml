[package]
name = "azums-poem"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "Native Poem extractor and background jobs integration for azums"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/azums"
documentation = "https://docs.rs/azums-poem"
homepage = "https://github.com/BlockForge-Dev/azums"
readme = "../../README.md"
keywords = ["poem", "job-queue", "background-jobs", "extractor"]
categories = ["web-programming::HTTP-server", "asynchronous"]

[dependencies]
azums = { version = "1.0.0", path = "../azums" }
azums-core = { version = "1.0.0", path = "../azums-core" }

poem = "3"
async-trait = "0.1"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

[dev-dependencies]
poem = { version = "3", features = ["test"] }
