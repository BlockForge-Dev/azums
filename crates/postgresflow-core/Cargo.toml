[package]
name = "postgresflow-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Core data types and StorageBackend trait for postgresflow"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/postgresflow"
documentation = "https://docs.rs/postgresflow-core"
homepage = "https://github.com/BlockForge-Dev/postgresflow"
readme = "../../README.md"
keywords = ["job-queue", "background-jobs", "task-queue", "storage-backend"]
categories = ["asynchronous"]

[features]
default = ["sqlx"]
sqlx = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

# Optional: sqlx FromRow derives for SQL-based backends
sqlx = { version = "0.7", optional = true, features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }
