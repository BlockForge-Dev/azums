[package]
name = "azums-rocket"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "Native Rocket request guard and background jobs integration for azums"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/azums"
documentation = "https://docs.rs/azums-rocket"
homepage = "https://github.com/BlockForge-Dev/azums"
readme = "../../README.md"
keywords = ["rocket", "job-queue", "background-jobs", "request-guard"]
categories = ["web-programming::HTTP-server", "asynchronous"]

[dependencies]
azums = { version = "0.1.2", path = "../azums" }
azums-core = { version = "0.1.2", path = "../azums-core" }

rocket = "0.5"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"

[dev-dependencies]
rocket = { version = "0.5", features = ["json"] }
