[package]
name = "postgresflow"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Postgres-backed job queue with transactional leasing, DLQ, retries, and an admin API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/postgresflow"
documentation = "https://docs.rs/postgresflow"
homepage = "https://github.com/BlockForge-Dev/postgresflow"
readme = "../../README.md"
keywords = ["postgres", "job-queue", "background-jobs", "task-queue", "sqlx"]
categories = ["database", "asynchronous"]

[features]
default = ["postgres", "api", "cli"]
postgres = []
api = ["dep:axum"]
cli = []

[dependencies]
postgresflow-core = { path = "../postgresflow-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
rand = "0.8"

uuid = { version = "1", features = ["v4", "serde"] }

# Optional: only needed when `api` feature is enabled
axum = { version = "0.7", optional = true }


[dev-dependencies]
testcontainers = "0.15"
serial_test = "3"
dotenvy = "0.15"


[[bin]]
name = "pgflowctl"
path = "src/bin/pgflowctl.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
