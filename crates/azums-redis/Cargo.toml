[package]
name = "azums-redis"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Production-grade Redis storage and streaming backend driver for azums"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlockForge-Dev/azums"
documentation = "https://docs.rs/azums-redis"
homepage = "https://github.com/BlockForge-Dev/azums"
readme = "../../README.md"
keywords = ["redis", "job-queue", "background-jobs", "task-queue", "storage-backend"]
categories = ["database", "asynchronous"]

[dependencies]
azums-core = { version = "0.2.1", path = "../azums-core" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
redis = { version = "0.25", features = ["tokio-comp", "aio", "connection-manager", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
tracing = "0.1"
