name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Build & Test (Linux / stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: azums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Test Suite
        run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/azums_test

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt Style Check
        run: cargo fmt --all -- --check

      - name: Workspace API Documentation Check
        run: cargo doc --workspace --no-deps

  test-windows:
    name: Build & Test (Windows / stable)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Test Suite
        run: cargo test --workspace

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt Style Check
        run: cargo fmt --all -- --check
