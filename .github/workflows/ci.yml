name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --ignore RUSTSEC-2023-0071

  linux-test:
    name: Build & Test (Linux / ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: azums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Test Suite
        run: cargo test --workspace
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/azums_test

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt Style Check
        run: cargo fmt --all -- --check

      - name: Workspace API Documentation Check
        run: cargo doc --workspace --all-features --no-deps

      - name: Public API Example Coverage
        if: matrix.rust == 'nightly'
        run: cargo doc -p azums --lib --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs

  cross-platform-test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        rust: [stable, beta, nightly]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Workspace Compilation Check
        run: cargo check --workspace --all-targets

      - name: Workspace Test Suite
        run: cargo test --workspace

      - name: Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt Style Check
        run: cargo fmt --all -- --check

      - name: Workspace API Documentation Check
        run: cargo doc --workspace --all-features --no-deps

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: azums_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure Code Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/azums_test

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  msrv-check:
    name: MSRV Check (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MSRV Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88'

      - name: MSRV Workspace Check
        run: cargo check --workspace --all-targets

