name: Release Automation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to resume after a partial publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Crates to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Release Tag
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Manual release version is invalid: ${version}" >&2
              exit 1
            fi
          else
            if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
              echo "Release publication must run from a v* tag." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "AZUMS_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          bash scripts/publish-crates.sh --check "${version}"

      - name: Test Release Commit
        run: cargo test --workspace --locked

      - name: Run 10,000-Scenario Chaos Gate
        env:
          AZUMS_CHAOS_SCENARIOS: "10000"
        run: >-
          cargo test -p azums --release --test chaos
          m11_memory_randomized_chaos_10000_plus -- --ignored --nocapture

      - name: Run Million-Job Concurrency Gate
        env:
          AZUMS_M8_STRESS: "1"
          AZUMS_M8_JOB_COUNTS: "10000,50000,100000,1000000"
          AZUMS_M8_WORKERS: "1,2,5,10,50,100"
        run: >-
          cargo test -p azums --release --test m8_concurrency_backpressure
          m8_large_job_count_stress_matrix -- --ignored --nocapture

      - name: Publish Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          bash scripts/publish-crates.sh "${AZUMS_RELEASE_VERSION}"
