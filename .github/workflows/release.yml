name: Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Crates to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Login
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish azums-core
        continue-on-error: true
        run: |
          cargo publish -p azums-core || true
          sleep 15

      - name: Publish azums-redis
        continue-on-error: true
        run: |
          cargo publish -p azums-redis || true
          sleep 15

      - name: Publish azums
        continue-on-error: true
        run: |
          cargo publish -p azums || true
          sleep 15

      - name: Publish azums-postgres
        continue-on-error: true
        run: cargo publish -p azums-postgres || true

      - name: Publish azums-axum
        continue-on-error: true
        run: cargo publish -p azums-axum || true

      - name: Publish azums-actix
        continue-on-error: true
        run: cargo publish -p azums-actix || true

      - name: Publish azums-poem
        continue-on-error: true
        run: cargo publish -p azums-poem || true

      - name: Publish azums-rocket
        continue-on-error: true
        run: cargo publish -p azums-rocket || true
