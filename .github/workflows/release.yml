name: Release Automation

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Crates to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Login
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish azums-core
        run: cargo publish -p azums-core

      - name: Publish azums-postgres
        run: cargo publish -p azums-postgres

      - name: Publish azums-redis
        run: cargo publish -p azums-redis

      - name: Publish azums
        run: cargo publish -p azums

      - name: Publish azums-axum
        run: cargo publish -p azums-axum

      - name: Publish azums-actix
        run: cargo publish -p azums-actix

      - name: Publish azums-poem
        run: cargo publish -p azums-poem

      - name: Publish azums-rocket
        run: cargo publish -p azums-rocket

      - name: Publish azums-dashboard
        run: cargo publish -p azums-dashboard

      - name: Publish worker
        run: cargo publish -p worker
