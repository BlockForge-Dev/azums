name: Release Automation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Crates to Crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Validate Release Tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Release publication must run from a v* tag." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "AZUMS_RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"
          bash scripts/publish-crates.sh --check "${version}"

      - name: Test Release Commit
        run: cargo test --workspace --locked

      - name: Run 10,000-Scenario Chaos Gate
        env:
          AZUMS_CHAOS_SCENARIOS: "10000"
        run: >-
          cargo test -p azums --release --test chaos
          m11_memory_randomized_chaos_10000_plus -- --ignored --nocapture

      - name: Run Million-Job Concurrency Gate
        env:
          AZUMS_M8_STRESS: "1"
          AZUMS_M8_JOB_COUNTS: "10000,50000,100000,1000000"
          AZUMS_M8_WORKERS: "1,2,5,10,50,100"
        run: >-
          cargo test -p azums --release --test m8_concurrency_backpressure
          m8_large_job_count_stress_matrix -- --ignored --nocapture

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish Crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          bash scripts/publish-crates.sh "${AZUMS_RELEASE_VERSION}"
