name: Benchmarks & Performance Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Criterion Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgresflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion Benchmarks
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/postgresflow_dev
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo bench --benches --all-features

      - name: Create Isolated Performance Databases
        env:
          PGPASSWORD: postgrespassword
        run: |
          createdb --host 127.0.0.1 --username postgres azums_perf_baseline
          createdb --host 127.0.0.1 --username postgres azums_perf_current
          createdb --host 127.0.0.1 --username postgres azums_perf_confirmation_baseline
          createdb --host 127.0.0.1 --username postgres azums_perf_confirmation_current

      - name: Run Baseline M14 Performance Matrix
        env:
          BASELINE_SOURCE_DIR: ${{ runner.temp }}/azums-perf-baseline-src-${{ github.run_id }}-${{ github.run_attempt }}
          BASELINE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/azums_perf_baseline
          REDIS_URL: redis://127.0.0.1:6379/1
          AZUMS_PERF_BACKENDS: memory,sqlite,postgres,redis
          AZUMS_PERF_JOBS: 1000
          AZUMS_PERF_ITERATIONS: 3
          AZUMS_PERF_OUTPUT_DIR: ${{ github.workspace }}/target/azums-perf-baseline
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/baseline-build
        run: |
          baseline_sha="${PR_BASE_SHA:-$BASELINE_SHA}"
          if [ -z "$baseline_sha" ] ||
             [ "$baseline_sha" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$baseline_sha^{commit}"; then
            baseline_sha="$(git rev-parse HEAD^)"
          fi

          echo "PERF_BASELINE_SHA=$baseline_sha"
          git worktree add --detach "$BASELINE_SOURCE_DIR" "$baseline_sha"
          cargo run \
            --manifest-path "$BASELINE_SOURCE_DIR/crates/azums/Cargo.toml" \
            --release \
            --bin azums-perf

      - name: Run Current M14 Performance Matrix
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/azums_perf_current
          REDIS_URL: redis://127.0.0.1:6379/2
          AZUMS_PERF_BACKENDS: memory,sqlite,postgres,redis
          AZUMS_PERF_JOBS: 1000
          AZUMS_PERF_ITERATIONS: 3
          AZUMS_PERF_OUTPUT_DIR: target/azums-perf
        run: |
          cargo run -p azums --release --bin azums-perf

      - name: Guard Performance Regressions
        env:
          BASELINE_SOURCE_DIR: ${{ runner.temp }}/azums-perf-baseline-src-${{ github.run_id }}-${{ github.run_attempt }}
          AZUMS_PERF_BACKENDS: memory,sqlite,postgres,redis
          AZUMS_PERF_JOBS: 1000
          AZUMS_PERF_ITERATIONS: 3
        run: |
          if cargo run -p azums --release --bin azums-perf-guard -- \
            target/azums-perf-baseline/m14_report.json \
            target/azums-perf/m14_report.json; then
            exit 0
          fi

          echo "Initial regression signal detected; running reverse-order confirmation."
          DATABASE_URL=postgres://postgres:postgrespassword@127.0.0.1:5432/azums_perf_confirmation_current \
          REDIS_URL=redis://127.0.0.1:6379/3 \
          AZUMS_PERF_OUTPUT_DIR=target/azums-perf-confirmation-current \
            cargo run -p azums --release --bin azums-perf

          DATABASE_URL=postgres://postgres:postgrespassword@127.0.0.1:5432/azums_perf_confirmation_baseline \
          REDIS_URL=redis://127.0.0.1:6379/4 \
          AZUMS_PERF_OUTPUT_DIR=${{ github.workspace }}/target/azums-perf-confirmation-baseline \
          CARGO_TARGET_DIR=${{ github.workspace }}/target/baseline-build \
            cargo run \
              --manifest-path "$BASELINE_SOURCE_DIR/crates/azums/Cargo.toml" \
              --release \
              --bin azums-perf

          cargo run -p azums --release --bin azums-perf-guard -- \
            target/azums-perf-baseline/m14_report.json \
            target/azums-perf/m14_report.json \
            target/azums-perf-confirmation-baseline/m14_report.json \
            target/azums-perf-confirmation-current/m14_report.json

      - name: Prepare Dashboard Artifact
        run: |
          mkdir -p target/dashboard
          cp -r docs/benchmarks/* target/dashboard/
          cp -r target/criterion target/dashboard/criterion || true
          cp -r target/azums-perf target/dashboard/azums-perf || true

      - name: Upload Performance Baseline
        uses: actions/upload-artifact@v6
        with:
          name: azums-perf-baseline
          path: target/azums-perf/m14_report.json
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/dashboard
          publish_branch: gh-pages
