name: Benchmarks & Performance Dashboard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Criterion Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgresflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Criterion Benchmarks
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/postgresflow_dev
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          cargo bench --benches --all-features

      - name: Run M14 Performance Matrix
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/postgresflow_dev
          REDIS_URL: redis://127.0.0.1:6379
          AZUMS_PERF_BACKENDS: memory,sqlite,postgres,redis
          AZUMS_PERF_JOBS: 10000
          AZUMS_PERF_ITERATIONS: 5
          AZUMS_PERF_OUTPUT_DIR: target/azums-perf
        run: |
          cargo run -p azums --release --bin azums-perf

      - name: Download Performance Baseline
        uses: actions/download-artifact@v4
        with:
          name: azums-perf-baseline
          path: target/azums-perf-baseline
        continue-on-error: true

      - name: Guard Performance Regressions
        run: |
          if [ -f target/azums-perf-baseline/m14_report.json ]; then
            cargo run -p azums --bin azums-perf-guard -- \
              target/azums-perf-baseline/m14_report.json \
              target/azums-perf/m14_report.json
          else
            echo "PERF_GUARD_SKIP reason=missing-baseline-artifact"
          fi

      - name: Prepare Dashboard Artifact
        run: |
          mkdir -p target/dashboard
          cp -r docs/benchmarks/* target/dashboard/
          cp -r target/criterion target/dashboard/criterion || true
          cp -r target/azums-perf target/dashboard/azums-perf || true

      - name: Upload Performance Baseline
        uses: actions/upload-artifact@v4
        with:
          name: azums-perf-baseline
          path: target/azums-perf/m14_report.json
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/dashboard
          publish_branch: gh-pages
