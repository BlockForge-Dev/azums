name: Configure crates.io Trusted Publishing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Configure Trusted Publishers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Create missing publisher configurations
        shell: bash
        run: |
          set -euo pipefail

          readonly endpoint="https://crates.io/api/v1/trusted_publishing/github_configs"
          readonly crates=(
            azums-core
            azums-redis
            azums
            azums-postgres
            azums-axum
            azums-actix
            azums-poem
            azums-rocket
          )

          for crate in "${crates[@]}"; do
            configs=$(curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header "Authorization: ${CARGO_REGISTRY_TOKEN}" \
              --header "User-Agent: azums-trusted-publisher-setup/1.0" \
              --get \
              --data-urlencode "crate=${crate}" \
              "${endpoint}")

            if jq --exit-status \
              --arg owner "BlockForge-Dev" \
              --arg repo "azums" \
              --arg workflow "release.yml" \
              --arg environment "crates-io" \
              '.github_configs[] | select(
                .repository_owner == $owner and
                .repository_name == $repo and
                .workflow_filename == $workflow and
                .environment == $environment
              )' <<<"${configs}" >/dev/null; then
              echo "${crate}: trusted publisher already configured"
              continue
            fi

            body=$(jq --null-input \
              --arg crate "${crate}" \
              --arg owner "BlockForge-Dev" \
              --arg repo "azums" \
              --arg workflow "release.yml" \
              --arg environment "crates-io" \
              '{github_config: {
                crate: $crate,
                repository_owner: $owner,
                repository_name: $repo,
                workflow_filename: $workflow,
                environment: $environment
              }}')

            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --header "Authorization: ${CARGO_REGISTRY_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "User-Agent: azums-trusted-publisher-setup/1.0" \
              --request POST \
              --data "${body}" \
              "${endpoint}" >/dev/null
            echo "${crate}: trusted publisher configured"
          done
