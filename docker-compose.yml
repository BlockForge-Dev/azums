services:
  db:
    image: postgres:17
    command:
      - postgres
      - -c
      - synchronous_commit=${AZUMS_PG_SYNC_COMMIT:-on}
      - -c
      - fsync=${AZUMS_PG_FSYNC:-on}
      - -c
      - full_page_writes=${AZUMS_PG_FULL_PAGE_WRITES:-on}
      - -c
      - wal_compression=${AZUMS_PG_WAL_COMPRESSION:-on}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: azums_dev
    ports:
      - "5433:5432"
    volumes:
      - azums_db:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d azums_dev"]
      interval: 3s
      timeout: 3s
      retries: 30

  azums:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/azums_dev
      AZUMS_WORKER_ID: ${AZUMS_WORKER_ID:-worker-1}
      AZUMS_QUEUE: ${AZUMS_QUEUE:-default}
      AZUMS_LEASE_SECONDS: ${AZUMS_LEASE_SECONDS:-10}
      AZUMS_DEQUEUE_BATCH_SIZE: ${AZUMS_DEQUEUE_BATCH_SIZE:-512}
      AZUMS_REAP_INTERVAL_MS: ${AZUMS_REAP_INTERVAL_MS:-5000}
      AZUMS_VERBOSE_JOB_LOGS: ${AZUMS_VERBOSE_JOB_LOGS:-0}
      AZUMS_ADMIN_ADDR: ${AZUMS_ADMIN_ADDR:-0.0.0.0:3003}
      AZUMS_MIGRATE_ON_STARTUP: ${AZUMS_MIGRATE_ON_STARTUP:-1}
      AZUMS_API_TOKEN: ${AZUMS_API_TOKEN:-}
      AZUMS_MAX_PAYLOAD_BYTES: ${AZUMS_MAX_PAYLOAD_BYTES:-262144}
      AZUMS_MAX_ENQUEUE_PER_MINUTE: ${AZUMS_MAX_ENQUEUE_PER_MINUTE:-10000}
      AZUMS_DB_MAX_CONNECTIONS: ${AZUMS_DB_MAX_CONNECTIONS:-4}
      AZUMS_DB_ACQUIRE_TIMEOUT_SECS: ${AZUMS_DB_ACQUIRE_TIMEOUT_SECS:-10}
      AZUMS_DISABLE_SYNC_COMMIT: ${AZUMS_DISABLE_SYNC_COMMIT:-0}
      AZUMS_DISABLE_JIT: ${AZUMS_DISABLE_JIT:-1}
    ports:
      - "3003:3003"
    command: ["/app/worker"]
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/azums_dev
      AZUMS_WORKER_ID: ${AZUMS_WORKER_ID:-}
      AZUMS_QUEUE: ${AZUMS_QUEUE:-default}
      AZUMS_LEASE_SECONDS: ${AZUMS_LEASE_SECONDS:-10}
      AZUMS_DEQUEUE_BATCH_SIZE: ${AZUMS_DEQUEUE_BATCH_SIZE:-512}
      AZUMS_REAP_INTERVAL_MS: ${AZUMS_REAP_INTERVAL_MS:-5000}
      AZUMS_VERBOSE_JOB_LOGS: ${AZUMS_VERBOSE_JOB_LOGS:-0}
      AZUMS_ADMIN_ADDR: off
      AZUMS_MIGRATE_ON_STARTUP: 0
      AZUMS_API_TOKEN: ${AZUMS_API_TOKEN:-}
      AZUMS_MAX_PAYLOAD_BYTES: ${AZUMS_MAX_PAYLOAD_BYTES:-262144}
      AZUMS_MAX_ENQUEUE_PER_MINUTE: ${AZUMS_MAX_ENQUEUE_PER_MINUTE:-10000}
      AZUMS_DB_MAX_CONNECTIONS: ${AZUMS_DB_MAX_CONNECTIONS:-4}
      AZUMS_DB_ACQUIRE_TIMEOUT_SECS: ${AZUMS_DB_ACQUIRE_TIMEOUT_SECS:-10}
      AZUMS_DISABLE_SYNC_COMMIT: ${AZUMS_DISABLE_SYNC_COMMIT:-0}
      AZUMS_DISABLE_JIT: ${AZUMS_DISABLE_JIT:-1}
    command: ["/app/worker"]
    restart: unless-stopped

volumes:
  azums_db:
